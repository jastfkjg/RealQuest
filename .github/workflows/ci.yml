name: Container CI and build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_candidate:
        description: Build and test Cocos using the provisioned Creator 3.8.8 runner
        type: boolean
        default: false
      publish_images:
        description: Publish tested Cocos/API images from main (also requires build_candidate)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: realquest-cocos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Source, behavior and backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Prepare locked tools
        run: |
          set -euo pipefail
          npm ci
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock.txt
          npm run cocos:doctor
      - name: Verify sources and behavior without the editor
        run: |
          set -euo pipefail
          npm run cocos:sync
          npm run cocos:sources
          npm run cocos:test:unit
      - name: Verify backend
        working-directory: backend
        run: .venv/bin/python -m pytest -q --junitxml=../output/cocos-unit/backend.xml
      - name: Verify deployment contracts
        run: |
          python3 -m unittest discover -s tests/deployment
          for script in deploy/*.sh; do bash -n "$script"; done
      - name: Verify checkout stays clean
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: realquest-cocos-check-results
          path: output/cocos-unit/
          retention-days: 14
          if-no-files-found: ignore
  candidate:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.build_candidate
    runs-on: [self-hosted, cocos-3.8.8]
    timeout-minutes: 45
    env:
      REALQUEST_CONFIGURED_COCOS_CREATOR: ${{ vars.COCOS_CREATOR }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify provisioned SDK toolchain
        run: |
          set -euo pipefail
          rq_creator="${COCOS_CREATOR:-${REALQUEST_CONFIGURED_COCOS_CREATOR:-}}"
          test -n "$rq_creator" && test -x "$rq_creator"
          case "$rq_creator" in *$'\n'*|*$'\r'*) exit 1 ;; esac
          export COCOS_CREATOR="$rq_creator"
          printf 'COCOS_CREATOR=%s\n' "$rq_creator" >> "$GITHUB_ENV"
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; import assert from "node:assert/strict"; assert.equal(process.versions.node,fs.readFileSync(".nvmrc","utf8").trim()); const sdk=path.resolve(path.dirname(process.env.COCOS_CREATOR),"../Resources/resources/3d/engine/package.json"); assert.equal(JSON.parse(fs.readFileSync(sdk,"utf8")).version,"3.8.8");'
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.split("@").at(-1)')"
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'
      - name: Prepare locked Cocos and backend tools
        run: |
          set -euo pipefail
          npm ci
          python3 -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock.txt
          npm exec -- playwright install chromium
          nginx -v
          npm run cocos:doctor -- --browser
      - name: Verify canonical sources and behavior
        run: |
          set -euo pipefail
          npm run cocos:sync
          npm run cocos:sources
          npm run cocos:check
          npm run cocos:test:unit
          test -z "$(git status --porcelain)"
      - name: Verify backend
        working-directory: backend
        run: .venv/bin/python -m pytest -q
      - name: Build real production package
        env:
          REALQUEST_COCOS_BUILD: web-release-ci
          COCOS_USER_DATA: ${{ runner.temp }}/realquest-cocos-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          npm run cocos:build:release
          npm run cocos:package -- --build web-release-ci/web-desktop --output output/cocos-delivery
      - name: Verify production engine and Nginx delivery
        run: |
          set -euo pipefail
          npm run cocos:test:delivery -- --artifact output/cocos-delivery
          npm run cocos:test:delivery:lifecycle -- --artifact output/cocos-delivery
          npm run cocos:test:browser -- --build web-release-ci/web-desktop
          npm run cocos:test:network -- --artifact output/cocos-delivery
          npm run cocos:package -- --verify output/cocos-delivery
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: realquest-cocos-candidate
          path: output/cocos-delivery/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  build:
    needs: candidate
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      ACR_FRONTEND_REPOSITORY: ${{ vars.ACR_FRONTEND_REPOSITORY }}
      ACR_BACKEND_REPOSITORY: ${{ vars.ACR_BACKEND_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: realquest-cocos-candidate
          path: output/cocos-delivery
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify downloaded Cocos release
        run: node tools/cocos-release.mjs --verify output/cocos-delivery
      - name: Validate repositories
        id: repositories
        run: |
          set -euo pipefail
          [[ "$ACR_REGISTRY" =~ ^[a-z0-9][a-z0-9.-]*\.aliyuncs\.com$ ]]
          [[ "$ACR_NAMESPACE" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          [[ "$ACR_FRONTEND_REPOSITORY" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          [[ "$ACR_BACKEND_REPOSITORY" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          [[ "$ACR_FRONTEND_REPOSITORY" != "$ACR_BACKEND_REPOSITORY" ]]
          echo "frontend=$ACR_REGISTRY/$ACR_NAMESPACE/$ACR_FRONTEND_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "backend=$ACR_REGISTRY/$ACR_NAMESPACE/$ACR_BACKEND_REPOSITORY" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        id: frontend
        with:
          context: output/cocos-delivery
          file: output/cocos-delivery/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false
          tags: ${{ steps.repositories.outputs.frontend }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        id: backend
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false
          tags: ${{ steps.repositories.outputs.backend }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Record immutable images
        env:
          FRONTEND_IMAGE: ${{ steps.repositories.outputs.frontend }}@${{ steps.frontend.outputs.digest }}
          BACKEND_IMAGE: ${{ steps.repositories.outputs.backend }}@${{ steps.backend.outputs.digest }}
        run: python3 deploy/validate.py create image-metadata/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: realquest-release
          path: image-metadata/release.json
          retention-days: 90
          overwrite: true
      - name: Record promotion inputs
        run: |
          printf 'Build run ID: `%s`\n\n' "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          cat image-metadata/release.json >> "$GITHUB_STEP_SUMMARY"
